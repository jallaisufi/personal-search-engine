worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api_backend {
    # With `--scale api=N`, Docker DNS returns all replica IPs and nginx
    # round-robins across them. Open-source nginx resolves this name at
    # startup, so restart the gateway after changing the replica count.
    server api:8000;
    keepalive 32;
  }

  upstream web_frontend {
    server web:3000;
    keepalive 16;
  }

  # Rate limits per client IP. Answers run a language model, so they get a tighter limit.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=30r/m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ups=$upstream_addr';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server {
    listen 80;

    # Streamed answers (server-sent events): no buffering, long read timeout.
    location = /api/ask {
      limit_req zone=ask_limit burst=5 nodelay;
      proxy_pass http://api_backend/ask;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://api_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
      proxy_pass http://api_backend/health;
    }

    # Interactive API docs (FastAPI)
    location = /docs { proxy_pass http://api_backend/docs; }
    location = /openapi.json { proxy_pass http://api_backend/openapi.json; }

    # Everything else is the web UI.
    location / {
      proxy_pass http://web_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
  }
}
