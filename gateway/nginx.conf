worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api_backend {
    # With `--scale api=N`, Docker DNS returns all replica IPs and nginx
    # round-robins across them. Open-source nginx resolves this name at
    # startup, so restart the gateway after changing the replica count.
    server api:8000;
    keepalive 32;
  }

  # Rate limit per client IP; tightened for /api/ask once Ask mode lands.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ups=$upstream_addr';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server {
    listen 80;

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://api_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
      proxy_pass http://api_backend/health;
    }

    # The web UI (weekend 2) will be served here. Until then, show the API info.
    location / {
      proxy_pass http://api_backend/;
    }
  }
}
