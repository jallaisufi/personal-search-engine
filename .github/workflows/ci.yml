name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'sample-docs/**'
              - 'compose.yaml'
              - 'gateway/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend
      - run: ruff format --check .

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: search
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d search"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/search
      EMBEDDING_PROVIDER: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      # No Ollama in CI: deterministic fake embeddings, no model download, no keys.
      COMPOSE_PROFILES: ""
      EMBEDDING_PROVIDER: fake
      SYNC_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: personal-search-backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: |
          printf 'EMBEDDING_PROVIDER=fake\nSYNC_INTERVAL_SECONDS=5\nCOMPOSE_PROFILES=\n' > .env
          docker compose up -d --no-build
      - run: ./scripts/smoke_test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
