# Client authentication for the primary in scaled mode.
# Same as the image's default, plus the last line: it lets the read replica connect
# for streaming replication (the default file only covers ordinary databases).
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
